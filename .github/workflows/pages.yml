name: Publish draft simulator
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check CSS audit freshness
        run: node scripts/inventory-conditional-css.mjs --check
      - name: Reject obsolete positive UI selectors
        run: node scripts/prune-proven-obsolete-css.mjs --check
      - name: Reject obsolete legacy decision controls
        run: node scripts/check-legacy-decision-layout.mjs
      - name: Reject restored narrow breakpoint duplicate
        run: node scripts/check-narrow-breakpoint-padding.mjs
      - name: Reject overridden narrow decision placement
        run: node scripts/check-narrow-decision-main-grid.mjs
      - name: Reject overridden narrow setup gap
        run: node scripts/check-setup-main-gap-cascade.mjs
      - name: Reject overridden legacy team-panel gap, rows and padding
        run: node scripts/check-legacy-team-panel-gap.mjs
      - name: Reject identical conditional declarations
        run: node scripts/check-exact-conditional-duplicates.mjs
      - name: Check motion suppression cascade
        run: node scripts/check-motion-cascade.mjs
      - run: npm test
      - run: npm run build
      - run: npm run test:offline
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      - name: Verify published build
        run: node scripts/verify-publication.mjs
